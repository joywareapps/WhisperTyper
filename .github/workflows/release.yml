name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained
        run: |
          dotnet publish WhisperTyper.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o ./publish `
            -p:PublishSingleFile=false `
            -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Create portable ZIP
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./WhisperTyper-portable-win-x64.zip

      - name: Build Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: WhisperTyper.iss
          options: /DSourceDir=publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ./WhisperTyper-portable-win-x64.zip
            ./WhisperTyper-setup.exe