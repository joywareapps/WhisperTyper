name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (e.g. v1.0.0)'
        required: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish
        run: >
          dotnet publish WhisperTyper.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish/

      - name: Zip release
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          Compress-Archive -Path publish\* -DestinationPath "WhisperTyper-$tag-win-x64.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WhisperTyper ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: WhisperTyper-${{ steps.version.outputs.tag }}-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
